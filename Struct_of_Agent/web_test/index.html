<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>银行智能 Agent 测试</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #1f2933;
    --text-sub: #6b7280;
    --brand: #2563eb;
    --brand-hover: #1d4ed8;
    --user-bubble: #2563eb;
    --assistant-bubble: #f1f3f5;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* 顶部标题栏 */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px;
  }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--text-sub); }

  /* 会话区 */
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 0;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .message { display: flex; margin-bottom: 20px; }
  .message.user { justify-content: flex-end; }
  .message.assistant { justify-content: flex-start; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
  }
  .message.assistant .avatar {
    background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff;
  }
  .message.user .avatar {
    background: #e5e7eb; color: #4b5563;
  }
  .bubble {
    max-width: 72%;
    padding: 11px 15px;
    border-radius: var(--radius);
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .message.assistant .bubble {
    background: var(--assistant-bubble);
    border-top-left-radius: 4px;
    margin-left: 10px;
  }
  .message.user .bubble {
    background: var(--user-bubble);
    color: #fff;
    border-top-right-radius: 4px;
    margin-right: 10px;
  }
  .meta {
    margin: 6px 0 0 44px;
    font-size: 12px;
    color: var(--text-sub);
  }
  .message.user .meta { text-align: right; margin-right: 10px; }
  .tag {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 11px;
    background: #eef2ff;
    color: #4338ca;
    margin-right: 6px;
  }
  .typing {
    display: inline-flex; gap: 4px; align-items: center;
    padding: 4px 2px;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: #9ca3af; animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* 底部输入区 */
  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 14px 0 18px;
  }
  .input-box {
    max-width: 820px;
    margin: 0 auto;
    padding: 0 20px;
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    font-size: 12px; color: var(--text-sub);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 5px 12px;
    background: #fff; cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .composer {
    display: flex; align-items: flex-end; gap: 10px;
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 10px 12px;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .composer textarea {
    flex: 1;
    border: none; outline: none; resize: none;
    font-size: 15px; line-height: 1.5;
    max-height: 140px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
  }
  .composer button {
    border: none; outline: none; cursor: pointer;
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background .15s;
  }
  .composer button:hover { background: var(--brand-hover); }
  .composer button:disabled { background: #cbd5e1; cursor: not-allowed; }
  .composer button svg { width: 18px; height: 18px; }
  .hint { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 8px; }
</style>
</head>
<body>
  <header>
    <div class="logo">银</div>
    <div>
      <h1>银行智能 Agent 测试</h1>
      <div class="sub">自然语言对话 · 路由到 R1 转账 / R2 账单</div>
    </div>
  </header>

  <main id="scroll">
    <div class="container" id="chat"></div>
  </main>

  <footer>
    <div class="input-box">
      <div class="chips" id="chips">
        <button class="chip" data-text="给张三转账100元">给张三转账100元</button>
        <button class="chip" data-text="看看我这个月的消费分类">看看我这个月的消费分类</button>
        <button class="chip" data-text="记录一笔美团外卖午餐消费66元">记录一笔美团外卖午餐消费66元</button>
        <button class="chip" data-text="今天北京天气怎么样">今天北京天气怎么样</button>
        <button class="chip" data-text="帮我检测异常交易">帮我检测异常交易</button>
      </div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="输入你的需求，例如：给李四转账200元"></textarea>
        <button id="send" title="发送">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2 11 13"></path>
            <path d="M22 2 15 22 11 13 2 9z"></path>
          </svg>
        </button>
      </div>
      <div class="hint">Enter 发送 · Shift + Enter 换行 · 数据存储于临时数据库，重启后清空</div>
    </div>
  </footer>

<script>
  const chatEl = document.getElementById('chat');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const scrollEl = document.getElementById('scroll');

  // 每次打开页面生成独立会话，避免多标签页历史串扰
  const sessionId = 'web-' + Date.now();

  const AGENT_LABEL = { R1: '智能转账', R2: '账单分析', common: '通用搜索' };

  function scrollToBottom() {
    scrollEl.scrollTop = scrollEl.scrollHeight;
  }

  function addMessage(role, text, meta) {
    const wrap = document.createElement('div');
    wrap.className = 'message ' + role;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '我' : '银';
    wrap.appendChild(avatar);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);

    chatEl.appendChild(wrap);

    if (meta) {
      const metaEl = document.createElement('div');
      metaEl.className = 'meta';
      if (meta.agent && AGENT_LABEL[meta.agent]) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = AGENT_LABEL[meta.agent];
        metaEl.appendChild(tag);
      }
      if (meta.tools && meta.tools.length) {
        metaEl.appendChild(document.createTextNode('调用工具：' + meta.tools.join('、')));
      }
      chatEl.appendChild(metaEl);
    }

    scrollToBottom();
    return wrap;
  }

  function addTyping() {
    const wrap = document.createElement('div');
    wrap.className = 'message assistant';
    wrap.innerHTML =
      '<div class="avatar">银</div>' +
      '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    chatEl.appendChild(wrap);
    scrollToBottom();
    return wrap;
  }

  function removeTyping(el) {
    if (el && el.parentNode) el.parentNode.removeChild(el);
  }

  function autoResize() {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  }

  async function send(text) {
    text = (text || inputEl.value).trim();
    if (!text) return;

    inputEl.value = '';
    autoResize();
    addMessage('user', text);

    sendBtn.disabled = true;
    const typing = addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId })
      });
      const data = await res.json();
      removeTyping(typing);
      const reply = data.reply || '（无回复内容）';
      addMessage('assistant', reply, {
        agent: data.agent,
        tools: (data.trace && data.trace.tool_names) || []
      });
    } catch (err) {
      removeTyping(typing);
      addMessage('assistant', '请求失败：' + err.message);
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', () => send());
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  inputEl.addEventListener('input', autoResize);

  document.querySelectorAll('.chip').forEach((chip) => {
    chip.addEventListener('click', () => send(chip.dataset.text));
  });

  // 欢迎语
  addMessage('assistant',
    '你好，我是银行智能助手。你可以用自然语言告诉我需求，例如：\n' +
    '· 转账：给张三转账100元\n' +
    '· 账单：看看我这个月的消费分类\n' +
    '· 搜索：今天北京天气怎么样\n\n' +
    '我会自动路由到对应的 Agent（转账 → R1 / 账单 → R2 / 其他 → 通用搜索）为你处理。');
</script>
</body>
</html>
