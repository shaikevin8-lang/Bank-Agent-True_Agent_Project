[pytest]
; 阶段 5（D13）：测试体系分层。目录即分层，标记由 tests/conftest.py 自动派生，
; 不在用例上逐个写 @pytest.mark.unit —— 迁移 40+ 历史文件时不需要改动用例体。
testpaths = tests
addopts = -ra
python_files = test_*.py
markers =
    unit: 纯函数/内存实现的单元测试（无网络、无数据库、无容器）
    contract: HTTP/文档契约测试（TestClient 或静态口径断言）
    security: 安全门禁与红队测试（注入/凭据/沙箱/熔断/审计/越权/幂等）
    integration: 需真实 PostgreSQL、容器或整链路编排的集成测试
    e2e: 浏览器或前端脚本级端到端（tests/frontend/*.mjs，由 node 驱动）
    pg: 依赖真实 PostgreSQL（未配置 BANK_AGENT_TEST_DB_URL / BANK_AGENT_TEST_PG_URL 时跳过）
    slow: 起容器或耗时 >5s 的慢用例
    postgres: 需要真实 PostgreSQL 的集成验收（历史标记，与 pg 等价）
    auth_postgres: 认证链路需要真实 PostgreSQL 的验收
    seed_postgres: seed 数据验收
filterwarnings =
    default
