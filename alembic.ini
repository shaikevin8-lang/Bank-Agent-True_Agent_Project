# Alembic configuration. The connection URL is deliberately NOT stored here:
# migrations/env.py resolves it from BANK_AGENT_DB_URL (or DATABASE_URL),
# so this file stays free of credentials and safe to commit.
#
# NOTE: keep this file ASCII-only. configparser reads it with the locale
# encoding on Windows (GBK on zh-CN), so non-ASCII comments break
# `alembic upgrade` with UnicodeDecodeError before any migration runs.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/Struct_of_Agent
version_path_separator = os
# Revision file naming: V001 -> 0001_xxx
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
